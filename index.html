<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Abbey ❤️</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@400;500;600&display=swap');

  :root {
    --maroon: #641b2b;
    --deep: #3c0e19;
    --cream: #fffaf7;
    --paper: #fffdfb;
    --rose: #ead0d3;
    --muted: #8b6970;
    --shadow: 0 20px 60px rgba(60,14,25,.12);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    color: var(--deep);
    background:
      radial-gradient(circle at 10% 10%, rgba(234,208,211,.55), transparent 28%),
      radial-gradient(circle at 90% 30%, rgba(100,27,43,.08), transparent 25%),
      var(--cream);
    font-family: "DM Sans", sans-serif;
  }

  body::before {
    content: "♡";
    position: fixed;
    top: 5vh;
    left: 4vw;
    color: rgba(100,27,43,.06);
    font-size: 18rem;
    line-height: 1;
    pointer-events: none;
  }

  header {
    text-align: center;
    padding: 72px 24px 40px;
    position: relative;
  }

  .eyebrow {
    text-transform: uppercase;
    letter-spacing: .24em;
    font-size: .72rem;
    font-weight: 600;
    color: var(--maroon);
    margin-bottom: 14px;
  }

  h1, h2, .letter-title {
    font-family: "Cormorant Garamond", serif;
  }

  h1 {
    font-size: clamp(4rem, 11vw, 8rem);
    line-height: .78;
    margin: 0;
    color: var(--maroon);
    font-weight: 600;
  }

  .subtitle {
    max-width: 570px;
    margin: 28px auto 0;
    color: var(--muted);
    font-size: 1rem;
    line-height: 1.7;
  }

  .today {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-top: 22px;
    padding: 9px 15px;
    border: 1px solid var(--rose);
    border-radius: 999px;
    background: rgba(255,255,255,.65);
    color: var(--maroon);
    font-size: .8rem;
  }

  main {
    width: min(1050px, calc(100% - 32px));
    margin: 0 auto 90px;
  }

  .progress-wrap {
    background: rgba(255,255,255,.75);
    border: 1px solid var(--rose);
    border-radius: 22px;
    padding: 18px 20px;
    margin-bottom: 28px;
    box-shadow: 0 8px 30px rgba(60,14,25,.05);
  }

  .progress-top {
    display: flex;
    justify-content: space-between;
    gap: 20px;
    font-size: .78rem;
    color: var(--muted);
    margin-bottom: 10px;
  }

  .progress {
    height: 7px;
    border-radius: 999px;
    overflow: hidden;
    background: #f1e5e6;
  }

  .progress > div {
    height: 100%;
    width: 20%;
    background: var(--maroon);
    border-radius: inherit;
    transition: width .5s ease;
  }

  .letters {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
  }

  .letter {
    min-height: 190px;
    position: relative;
    border: 1px solid var(--rose);
    border-radius: 22px;
    background: var(--paper);
    padding: 24px;
    cursor: pointer;
    text-align: left;
    color: var(--deep);
    box-shadow: 0 8px 25px rgba(60,14,25,.055);
    transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
  }

  .letter:hover:not(.locked) {
    transform: translateY(-4px);
    box-shadow: var(--shadow);
    border-color: #c99ca3;
  }

  .letter.locked {
    cursor: not-allowed;
    background: #f7eeee;
    color: #a99398;
  }

  .number {
    font-family: "Cormorant Garamond", serif;
    font-size: 3.2rem;
    line-height: 1;
    color: var(--maroon);
    font-weight: 600;
  }

  .locked .number { color: #bda8ac; }

  .label {
    margin-top: 12px;
    font-family: "Cormorant Garamond", serif;
    font-size: 1.45rem;
    font-weight: 600;
  }

  .status {
    position: absolute;
    top: 22px;
    right: 20px;
    font-size: .72rem;
    color: var(--muted);
  }

  .heart {
    position: absolute;
    right: 20px;
    bottom: 20px;
    color: var(--maroon);
    font-size: 1.15rem;
  }

  .locked .heart { color: #c9b6ba; }

  footer {
    text-align: center;
    color: var(--muted);
    font-family: "Cormorant Garamond", serif;
    font-size: 1.2rem;
    padding: 0 20px 50px;
  }

  /* Letter modal */
  .overlay {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: none;
    place-items: center;
    padding: 20px;
    background: rgba(44,8,17,.58);
    backdrop-filter: blur(7px);
  }

  .overlay.show { display: grid; }

  .modal {
    width: min(680px, 100%);
    max-height: 88vh;
    overflow: auto;
    background: var(--paper);
    border-radius: 28px;
    padding: clamp(28px, 6vw, 58px);
    box-shadow: 0 35px 100px rgba(20,0,5,.28);
    position: relative;
  }

  .close {
    position: absolute;
    top: 18px;
    right: 20px;
    width: 38px;
    height: 38px;
    border: 0;
    border-radius: 50%;
    background: #f4e5e7;
    color: var(--maroon);
    font-size: 1.3rem;
    cursor: pointer;
  }

  .modal .number {
    font-size: 1.2rem;
    letter-spacing: .15em;
    text-transform: uppercase;
  }

  .modal h2 {
    color: var(--maroon);
    font-size: clamp(2.5rem, 7vw, 4.2rem);
    line-height: .95;
    margin: 12px 0 28px;
  }

  .modal p {
    white-space: pre-line;
    font-family: "Cormorant Garamond", serif;
    font-size: 1.45rem;
    line-height: 1.65;
    margin: 0;
  }

  .signature {
    margin-top: 30px;
    color: var(--maroon);
    font-family: "Cormorant Garamond", serif;
    font-size: 1.6rem;
  }

  @media (max-width: 760px) {
    .letters { grid-template-columns: repeat(2, 1fr); }
    header { padding-top: 52px; }
  }

  @media (max-width: 480px) {
    .letters { grid-template-columns: 1fr; }
    .letter { min-height: 150px; }
  }
</style>
</head>
<body>
<header>
  <div class="eyebrow">A little something for my darling girl.</div>
  <h1>Abbey</h1>
  <p class="subtitle">
    15 days away so here are 15 little reminders of ways in which I love and adore you sweetie
  </p>
  <div class="today" id="today"></div>
</header>

<main>
  <section class="progress-wrap">

      <span id="nextText">Letter 4 opens tomorrow ♡</span>
    </div>
    <div class="progress"><div id="progressBar"></div></div>
  </section>

  <section class="letters" id="letters"></section>
</main>

<footer>
  Made with love, one letter at a time. ♡
</footer>

<div class="overlay" id="overlay" onclick="closeModal(event)">
  <article class="modal">
    <button class="close" aria-label="Close" onclick="closeModal()">×</button>
    <div class="number" id="modalNumber"></div>
    <h2 id="modalTitle"></h2>
    <img id="letterImage" alt="Letter picture" style="display:none;width:100%;max-height:620px;object-fit:contain;border-radius:18px;margin:0 0 22px;box-shadow:0 12px 35px rgba(60,14,25,.14);"><p id="modalBody"></p>
    <a id="day10Game" href="https://strandsgame.net/game/?id=6238" target="_blank" rel="noopener noreferrer" style="display:none;margin:20px 0;color:#641b2b;font-weight:700;text-decoration:underline;">Play our custom Strands game ↗</a>
    <div class="signature">Always yours, ♡</div>
  </article>
</div>

  { title: "Day 8", body: "Hey my beautiful girl its Thursday and officially 1 week now until I’m home xx I know you’re missing me a lot bubba and its getting kind of hard, me not being there when you’re sick and to give you love. I know its sucks bub, but I also want to to realise how strong you are, thinking back over a week ago I reckon both of us you’d have thought this would be a lot tougher and not to say it isn’t tough because it is! But I just want to recognise how strong you are bubba, still taking action smashing out, gym, study, being sick and still showing up. You are such an incredible woman sweetie. That first cuddle is going to feel so good once I get home xx\n\nToday we went to my favourite ice cream place again and I immediately dropped in on the door in the store infront of everyone. So here are some cool NZ dairy facts\n\n1. Kiwi’s are one of the biggest ice cream eaters in the world, the average kiwi eats 24 litres of ice cream annually\n2. In NZ we have way more cows than actual humans, ONLY including diary cows there is a 1-1 ratio of human to cow and they create around 21 billion litres of milk a year or around 8000 Olympic sized swimming pools\n3. The top 3 iconic NZ icecreames are Hokey Pokey, Jelly Tip, and goodie goodie gun drop.\n4. NZ has one of if not the best dairy and farming industry in terms of cattle quality of life with the large majority of cows spending there whole life grazing on fresh grass, opposed to grain and living always outside." },

  { title: "Day 10", body: "Wooo Saturday only 5 more sleeps to go my sweet heart I MISS YOU SO MUCH ❤️ Woke up pretty hang over this morning sleeping on the floor in the lounge haha (I’m so sorry for falling asleep and not messaging you last night!) then we had another big drive up to Greg and Barbes batch. Was so nice such gangsta views and played some pool. Fark man I just wish you were here with me, nothing feels 100% right. Like I feel like me alone is not 100% me, because your apart of my and my soul bubba. I miss your laugh, your eyes, your smile, your smell and your big bum 😋 nah but fr miss you so much bub.\n\nNow here’s a custom strands game (click the link attached)." },

  { title: "Day 12", body: "Letter coming soon ♡" },

function unlockedCount() {
  const now = new Date();
  // October 1–15: day number determines how many are open.
  // Before Oct 1: none. From Oct 15 onward: all 15.
  if (now.getMonth() !== 9) return now.getMonth() > 9 ? 15 : 0;
  return Math.min(Math.max(now.getDate(), 0), 15);
}

function formatDate() {
  return new Intl.DateTimeFormat("en-NZ", {
    weekday: "long", day: "numeric", month: "long", year: "numeric"
  }).format(new Date());
}

function render() {
  const count = unlockedCount();
  document.getElementById("today").textContent = "♡ " + formatDate() + " ♡";
  document.getElementById("progressText").textContent =
    `${count} of 15 letter${count === 1 ? "" : "s"} unlocked`;
  document.getElementById("progressBar").style.width = `${(count / 15) * 100}%`;

  const next = document.getElementById("nextText");
  if (count >= 15) next.textContent = "All 15 letters are yours ♡";
  else if (count === 0) next.textContent = "The first letter opens on October 1 ♡";
  else next.textContent = `Letter ${count + 1} opens tomorrow ♡`;

  const grid = document.getElementById("letters");
  grid.innerHTML = "";

  letters.forEach((letter, i) => {
    const number = i + 1;
    const isOpen = number <= count;
    const card = document.createElement("button");
    card.className = "letter" + (isOpen ? "" : " locked");
    card.type = "button";
    card.setAttribute("aria-label", isOpen ? `Open letter ${number}` : `Letter ${number} is locked`);
    card.innerHTML = `
      <span class="status">${isOpen ? "OPEN" : "LOCKED"}</span>
      <div class="number">${String(number).padStart(2, "0")}</div>
      <div class="label">${isOpen ? letter.title : "A letter for later"}</div>
      <div class="heart">${isOpen ? "♥" : "♡"}</div>
    `;
    if (isOpen) card.onclick = () => openLetter(number);
    grid.appendChild(card);
  });
}

function openLetter(number) {
  const letter = letters[number - 1];
  document.getElementById("modalNumber").textContent = `Letter ${String(number).padStart(2, "0")}`;
  document.getElementById("modalTitle").textContent = letter.title;
  document.getElementById("modalBody").textContent = letter.body;
  document.getElementById("day10Game").style.display = number === 10 ? "inline-block" : "none";
  const letterImage = document.getElementById("letterImage");
  const letterImages = {4: "day4.png", 6: "day6.png", 7: "day7.png", 8: "day8.png", 9: "day9.png"};
  if (letterImages[number]) {
    letterImage.src = letterImages[number];
    letterImage.style.display = "block";
  } else {
    letterImage.removeAttribute("src");
    letterImage.style.display = "none";
  }
  document.getElementById("overlay").classList.add("show");
  document.body.style.overflow = "hidden";
}

function closeModal(event) {
  if (!event || event.target.id === "overlay" || event.target.classList.contains("close")) {
    document.getElementById("overlay").classList.remove("show");
    document.body.style.overflow = "";
  }
}

document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeModal();
});

render();
</script>
</body>
</html>
